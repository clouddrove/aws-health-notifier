name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.16.1" "mypy==1.19.1" pytest "moto[dynamodb,secretsmanager]" boto3 "boto3-stubs[dynamodb,secretsmanager]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -v
      - name: Package and verify Lambda import
        run: |
          make package
          python -c "import zipfile,sys; zipfile.ZipFile('dist/handler.zip').extractall('.pkg'); sys.path.insert(0,'.pkg'); import handler.handler; print('lambda entrypoint import OK')"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      # Validate the module and every example, so a broken example cannot merge.
      - name: Validate all roots
        run: |
          for d in . examples/*/; do
            echo "::group::validate $d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      # Native terraform test. The AWS provider is mocked, so this needs no
      # credentials and still exercises a real plan of the module.
      - name: Terraform test
        run: terraform test
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init
      - run: tflint
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12.3123.0
        with:
          directory: .
          framework: terraform
