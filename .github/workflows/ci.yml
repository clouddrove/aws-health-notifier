name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.16.1" "mypy==1.19.1" pytest "moto[dynamodb,secretsmanager]" boto3 "boto3-stubs[dynamodb,secretsmanager]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -v
      - name: Package and verify Lambda import
        run: |
          make package
          python -c "import zipfile,sys; zipfile.ZipFile('dist/handler.zip').extractall('.pkg'); sys.path.insert(0,'.pkg'); import handler.handler; print('lambda entrypoint import OK')"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform -chdir=terraform fmt -check
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --chdir=terraform --init
      - run: tflint --chdir=terraform
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12.3117.0
        with:
          directory: terraform
