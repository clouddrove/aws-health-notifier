version: 2

updates:
  # GitHub Actions used in ci.yml and deploy.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Terraform providers (aws, archive)
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]

  # Dev/CI Python tooling declared in pyproject.toml
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Dev/CI Docker base image
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
